<div id="archive-banner" class="archive-banner-overlay">
  <div class="archive-banner-modal">
    <div class="archive-banner-icon">
      <i class="fas fa-info-circle"></i>
    </div>
    <p class="archive-banner-text">
      thank you for using the service last updated May 2026(data may not be accurate)
    </p>
    <button class="archive-banner-btn" onclick="dismissBanner()">Continue</button>
  </div>
</div>

<style>
.archive-banner-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; justify-content: center; align-items: center;
  z-index: 10000;
  animation: fadeInOverlay 0.3s ease forwards;
}
.archive-banner-modal {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 16px;
  padding: 30px;
  max-width: 400px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  font-family: 'Inter', -apple-system, sans-serif;
  color: #e0e0e0;
  animation: scaleInModal 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.archive-banner-icon {
  font-size: 2.5rem;
  color: #ffbf00;
  margin-bottom: 16px;
}
.archive-banner-text {
  font-size: 1.05rem;
  line-height: 1.6;
  margin: 0 0 24px;
}
.archive-banner-btn {
  background: #ffbf00;
  color: #000;
  border: none;
  padding: 12px 30px;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 25px;
  cursor: pointer;
  transition: transform 0.2s, background-color 0.2s;
  width: 100%;
  box-shadow: 0 4px 15px rgba(255, 191, 0, 0.3);
}
.archive-banner-btn:hover {
  background: #e6ac00;
  transform: translateY(-2px);
}
.archive-banner-btn:active {
  transform: translateY(0);
}
@keyframes fadeInOverlay {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes scaleInModal {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>

<script>
function dismissBanner() {
  const banner = document.getElementById("archive-banner");
  if (banner) banner.remove();
  localStorage.setItem("archiveBannerDismissed", "true");
}

if (localStorage.getItem("archiveBannerDismissed") === "true") {
  document.getElementById("archive-banner")?.remove();
}
</script>
